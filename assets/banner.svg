<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b24"/>
      <stop offset="0.6" stop-color="#11145a"/>
      <stop offset="1" stop-color="#1c167a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#5a4ff0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5a4ff0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b2ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3496"/>
      <stop offset="1" stop-color="#1d2266"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#22a6c4"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Fira Code',Menlo,Consolas,monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#halo)"/>

    <!-- ===== Lado izquierdo: identidad ===== -->
    <text x="70" y="100" class="mono" font-size="18" fill="#7fe3ff">
      <tspan fill="#8f86ff">~/devnico2905</tspan> $ ./hello-world<tspan fill="#7fe3ff">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan>
    </text>

    <text x="66" y="170" class="sans" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="1">Nicolás Bernal</text>

    <text x="70" y="212" class="sans" font-size="20" font-weight="500" fill="#c9c4ff">Backend &amp; Cloud Developer · Java · Spring Boot · AWS</text>

    <g transform="translate(70 238)">
      <rect width="178" height="32" rx="16" fill="#3ef0a0" fill-opacity="0.12" stroke="#3ef0a0" stroke-opacity="0.5"/>
      <circle cx="20" cy="16" r="5" fill="#3ef0a0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="21.5" class="sans" font-size="15" font-weight="600" fill="#bff8de">Open to work</text>
    </g>

    <!-- ===== Lado derecho: arquitectura ===== -->
    <!-- límite de la nube -->
    <rect x="760" y="48" width="400" height="224" rx="22" fill="#ffffff" fill-opacity="0.03" stroke="#8f86ff" stroke-opacity="0.55" stroke-dasharray="7 7" stroke-width="1.6"/>
    <text x="782" y="76" class="mono" font-size="13" fill="#8f86ff">cloud · aws</text>

    <!-- conexiones -->
    <g fill="none" stroke="#7fe3ff" stroke-opacity="0.45" stroke-width="2">
      <path id="p1" d="M712 160 H790"/>
      <path id="p2" d="M850 160 C 880 160, 880 118, 912 118"/>
      <path id="p3" d="M850 160 C 880 160, 880 202, 912 202"/>
      <path id="p4" d="M1008 118 C 1040 118, 1040 160, 1070 160"/>
      <path id="p5" d="M1008 202 C 1040 202, 1040 160, 1070 160"/>
    </g>

    <!-- paquetes -->
    <g>
      <circle r="4.5" fill="#7fe3ff"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="4.5" fill="#7fe3ff"><animateMotion dur="1.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="4.5" fill="#ffb454"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="4.5" fill="#7fe3ff"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
      <circle r="4.5" fill="#ffb454"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    </g>

    <!-- cliente -->
    <g transform="translate(676 160)">
      <circle r="34" fill="url(#node)" stroke="#8f86ff" stroke-opacity="0.6" stroke-width="1.6"/>
      <rect x="-15" y="-11" width="30" height="19" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M-19 12 H19" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <text y="56" text-anchor="middle" class="mono" font-size="12" fill="#a9b2ff">client</text>
    </g>

    <!-- gateway (hexágono) -->
    <g transform="translate(820 160)">
      <path d="M0 -32 L28 -16 V16 L0 32 L-28 16 V-16 Z" fill="url(#node)" stroke="#8f86ff" stroke-opacity="0.8" stroke-width="1.6"/>
      <path d="M-9 -7 L-15 0 L-9 7 M9 -7 L15 0 L9 7" fill="none" stroke="#7fe3ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="54" text-anchor="middle" class="mono" font-size="12" fill="#a9b2ff">gateway</text>
    </g>

    <!-- servicios -->
    <g class="mono" font-size="13">
      <g transform="translate(912 96)">
        <rect width="96" height="44" rx="10" fill="url(#node)" stroke="#8f86ff" stroke-opacity="0.6" stroke-width="1.6"/>
        <circle cx="16" cy="22" r="4" fill="#3ef0a0"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
        <text x="28" y="26.5" fill="#ffffff">auth</text>
      </g>
      <g transform="translate(912 180)">
        <rect width="96" height="44" rx="10" fill="url(#node)" stroke="#8f86ff" stroke-opacity="0.6" stroke-width="1.6"/>
        <circle cx="16" cy="22" r="4" fill="#3ef0a0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
        <text x="28" y="26.5" fill="#ffffff">orders</text>
      </g>
    </g>

    <!-- base de datos -->
    <g transform="translate(1072 134)">
      <path d="M0 8 V44 a26 8 0 0 0 52 0 V8" fill="url(#db)"/>
      <ellipse cx="26" cy="8" rx="26" ry="8" fill="#5fd4ec"/>
      <path d="M0 26 a26 8 0 0 0 52 0" fill="none" stroke="#5fd4ec" stroke-width="2"/>
      <text x="26" y="78" text-anchor="middle" class="mono" font-size="12" fill="#a9b2ff">postgres</text>
    </g>
  </g>
</svg>
